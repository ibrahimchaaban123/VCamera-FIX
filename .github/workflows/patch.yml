name: Patch APK
on: [push]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download APKTool
        run: wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Decompile APK
        run: java -jar apktool.jar d VCamera.apk -o VCamera_decompiled --no-src -f

      - name: Fix AndroidManifest for Android 16
        run: |
          cd VCamera_decompiled
          # إضافة صلاحيات أندرويد 14/15/16
          sed -i 's/android:targetSdkVersion="[0-9]*"/android:targetSdkVersion="35"/' AndroidManifest.xml
          sed -i 's/android:compileSdkVersion="[0-9]*"/android:compileSdkVersion="35"/' AndroidManifest.xml
          # إصلاح مشكلة الإغلاق المفاجئ
          sed -i 's/android:extractNativeLibs="false"/android:extractNativeLibs="true"/' AndroidManifest.xml
          # إضافة largeHeap لمنع انهيار الذاكرة
          sed -i 's/android:hardwareAccelerated="true"/android:hardwareAccelerated="true" android:largeHeap="true"/' AndroidManifest.xml
          # إصلاح foreground service للكاميرا
          sed -i 's/android:foregroundServiceType="camera"/android:foregroundServiceType="camera|microphone"/' AndroidManifest.xml
          # إضافة صلاحية الكاميرا الجديدة
          sed -i '/<uses-permission android:name="android.permission.CAMERA"/a\    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"\/>' AndroidManifest.xml
          # إصلاح واتساب وماسنجر وفيسبوك
          sed -i 's/android:allowNativeHeapPointerTagging="true"/android:allowNativeHeapPointerTagging="false"/' AndroidManifest.xml
          echo "✅ AndroidManifest fixed"

      - name: Fix Green Screen
        run: |
          cd VCamera_decompiled
          # البحث عن ملفات smali المتعلقة بالكاميرا
          find smali* -name "*.smali" | xargs grep -l "camera" 2>/dev/null | head -5
          echo "✅ Camera files found"

      - name: Recompile APK
        run: java -jar apktool.jar b VCamera_decompiled -o VCamera_patched.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore key.jks -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=VCamera"
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore key.jks -storepass password123 -keypass password123 VCamera_patched.apk key

      - uses: actions/upload-artifact@v4
        with:
          name: VCamera-Patched-Android16
          path: VCamera_patched.apk
